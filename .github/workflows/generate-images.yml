name: Generate Product Images

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs leerlassen = alle fehlenden generieren. Sonst space-separated, z. B.: hero abrollcontainer"
        required: false
        default: ""
      force:
        description: "Auch existierende Bilder neu generieren"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate images via kie.ai
        env:
          KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node scripts/generate-images.mjs ${{ inputs.slugs }}

      - name: Commit & push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "Keine neuen Bilder zu committen."
          else
            git commit -m "chore(images): auto-generate via kie.ai/Nano Banana [skip ci]"
            git push
          fi
